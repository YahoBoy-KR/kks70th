<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김기송 님의 고희연 초대장</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f3efe6;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }
        .invite-container {
            width: 100%;
            max-width: 480px;
            background-color: #faf6ee;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border-radius: 12px;
        }
        .image-card {
            width: 100%;
            text-align: center;
            border-bottom: 3px dashed #e2d7c5;
            background-color: #ffffff;
        }
        .image-card:last-child {
            border-bottom: none;
        }
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

<div class="invite-container">
    <!-- 첫 번째 이미지 카드 -->
    <div class="image-card">
        <img src="https://i.imgur.com/w2R8TiR.png">
    </div>

    <!-- 두 번째 이미지 카드 -->
    <div class="image-card">
        <img src="https://i.imgur.com/fN3y9VI.jpeg">
    </div>

    <!-- 세 번째 이미지 카드 -->
    <div class="image-card">
        <img src="https://i.imgur.com/fzld29h.png">
    </div>

    <!-- 네 번째 이미지 카드 -->
    <div class="image-card">
        <img src="https://i.imgur.com/lV3JUCQ.png">
    </div>
</div>

</body>
</html>
